# The release the site is written against: every version on the page equals
# this one (the pin test), and the macOS test leg runs this exact artifact
# after checking its digest (the help test). Renovate moves the version;
# `limen pins refresh` brings the digest along. The attestation is held to
# the signing workflow by name: taciturn's own release.yaml up to v0.3.0;
# from v0.4.0 taciturn releases through limen's Apple lane, so that bump
# moves the signer to farcloser/limen/.github/workflows/limen-release-apple.yaml
# or the refresh fails closed, which is the pin doing its job.
pins:
  - name: taciturn
    renovate: github-releases forkcloser/taciturn
    version: 0.4.0
    url: https://github.com/forkcloser/taciturn/releases/download/v${version}/taciturn_${version}_darwin_arm64.tar.gz
    verify: github-attestation forkcloser/taciturn forkcloser/taciturn/.github/workflows/release.yaml
    digest:
      version: 0.3.0
      sha256: 6b75d37041be4468111bfba875341ce92dee05cdcba7f2757c3be3b7d913a65c
