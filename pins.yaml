# The release the site is written against: every version on the page equals
# this one (the pin test), and the macOS test leg runs this exact artifact
# after checking its digest (the help test). Renovate moves the version;
# `limen pins refresh` brings the digest along. The attestation is held to
# this repository and to the signing workflow by name: limen's Apple release
# lane, which taciturn releases through since v0.4.0 (its own release.yaml
# signed up to v0.3.0). A release signed by anything else fails the refresh
# closed.
pins:
  - name: taciturn
    renovate: github-releases forkcloser/taciturn
    version: 0.4.0
    url: https://github.com/forkcloser/taciturn/releases/download/v${version}/taciturn_${version}_darwin_arm64.tar.gz
    verify: github-attestation forkcloser/taciturn farcloser/limen/.github/workflows/limen-release-apple.yaml
    digest:
      version: 0.4.0
      sha256: 90007a17f7114f06540fcfa1add946f316f6e10555961c20177c5f35c1ddaeaf
